# vocabulary.yml -- the words people read, in one file.
#
# WHO EDITS THIS: the team, not a programmer. Change the text after the colon;
# leave the key (the part before the colon) exactly as it is. Save, then restart
# the service (or ask whoever runs it to). docs/vocabulary-guide.md explains every
# key, where it shows up, and the isiXhosa / isiZulu columns for native speakers.
#
# PLACEHOLDERS: {brand} is the product name, {entity} is what a record is called
# ("report"), {entity_plural} is "reports", {language} and {ref} fill in at the
# point of use. Keep them, exactly as written, in any sentence that has them.
#
# If a key is missing or empty here, the word falls back to the built-in default
# and `casey doctor` lists the key. Nothing breaks.
#
# THE DEFAULT ENGLISH BELOW IS PLACEHOLDER WORDING. The team decides the final words.

version: 1

