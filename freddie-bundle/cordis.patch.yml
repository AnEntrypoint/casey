# casey's own patch layer, applied over @freddie/freddie-base's own
# insert rows (see src/casey.js's boot() call, which composes
# [...freddie-base's own patches, ...this file] as one flattened patch array).
#
# SECURITY (AGENTS.md, "freddie integration" section, the paragraph headed
# "the load-bearing replacement for the old enabledToolsets contract"):
# freddie-base bundles real
# bash/write/edit/file/credential tools in the SAME global ctx.tools registry
# casey's own case_* tools register into -- there is no toolset-category
# separation at the freddie layer. installToolAllowlist
# (src/case-tools/tool-allowlist.js), installed per-agent via
# ctx.agents.create()'s setup() callback (see src/agent/run-turn.js), is the
# real enforcement boundary: every contact-facing turn's agent only ever
# sees/can-execute case_* tool names, regardless of what freddie-base itself
# registers globally. This composition file cannot exclude freddie-base's
# tool-registering rows without losing the LLM/agent-loop plumbing casey
# needs from the same bundle -- see that file's own header comment for the
# full rationale.

- insert:
    # freddie-base does not itself insert a webServer row (that lives in the
    # freddie-web-app bundle alongside the whole browser SPA/client UI casey
    # does not want) -- insert the plain standalone Service directly, with a
    # literal host/port config instead of web-app's own webStartup CLI-args
    # provider dependency casey has no use for.
    #
    # This is a SECOND listening socket, not the dashboard's. The dashboard is
    # its own Express app that bin/worker.js binds itself (`--port`, default
    # 4000) after this tree is already up; freddie's WebServer listens the
    # instant this row activates. Both defaulted to 4000, and since worker.js
    # calls createCasey() -- and therefore this boot -- before createDashboard(),
    # freddie took the port and the dashboard died on it: EADDRINUSE, exit 44,
    # "dashboard failed to bind port 4000", on a stock `casey up`. Its own port
    # knob, defaulting clear of the dashboard's, is what stops that. It carries
    # exactly one route, WhatsappAdapter's webhook, so a WhatsApp deployment
    # must publish THIS port to Meta, not the dashboard's.
    - id: casey-webserver
      name: '@freddie/freddie-host-webserver'
      config:
        host: !!js process.env.CASEY_WEBHOOK_HOST || '127.0.0.1'
        port: !!js Number(process.env.CASEY_WEBHOOK_PORT) || 4001

    - id: casey-case-tools
      name: ./src/case-tools/index.js

    - id: casey-llm-acptoapi
      name: ./src/llm-acptoapi/index.js

    - id: casey-platform
      name: ./src/platform/index.js
      inject: [webServer]
