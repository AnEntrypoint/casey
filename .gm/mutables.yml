- mutable_id: report-analytics-no-pii-leak
  obligation_kind: invariant
  subject: None of report-analytics.js/overview.js/workload.js/clusters.js/geo.js reference external_id or contact_id in any output shape, including nested event.data fields.
  id: mut-1787130451360
  status: witnessed
  witness_evidence: 'Full-file reads: src/report-analytics.js (257 lines), src/overview.js (129 lines), src/workload.js (128 lines), src/clusters.js (96 lines), src/geo.js (65 lines). Zero occurrences of external_id or contact_id in any of the five files. report-analytics.js only reads c.id/c.ref/c.case_type/c.channel and event fields kind/created_at/actor/data.from/data.to/data.by (data.by is an operator id per workload.js:13, not a contact identifier). clusters.js:85 buildClusters members map emits {id,ref,status,subject,case_type} only -- case-level fields already surfaced elsewhere, no contact PII. geo.js/overview.js/workload.js never touch a contact-identifying field; workload.js:86-87 explicitly reads data.by (operator) and gates it through rosterIds.has(by) (workload.js:87) before ever surfacing it, so even an operator id cannot enter the aggregate unless it is a known roster member.'
- mutable_id: k-anonymity-folding-applied-everywhere
  obligation_kind: invariant
  subject: CASEY_MIN_AGGREGATE_CELL small-cell suppression applies to every named-bucket rollup (channel, case_type in report-analytics.js; place in geo.js), unknown correctly exempted only where it names nothing.
  id: mut-1787130453239
  status: witnessed
  witness_evidence: 'report-analytics.js:120-121 defines MIN_AGGREGATE_CELL from CASEY_MIN_AGGREGATE_CELL (default 5) and SPARSE_BUCKET_KEY=''other/sparse''; suppressSmallCells (lines 161-194) is applied by rollupByKey (lines 140-153), which both buildChannelMetrics (line 128, channel bucket) and buildCaseTypeMetrics (line 135, case_type bucket) route through -- both named-bucket rollups in this file fold buckets with s.opened < MIN_AGGREGATE_CELL into SPARSE_BUCKET_KEY (lines 173-180). geo.js:22 defines the identical MIN_AGGREGATE_CELL from the same env var and SPARSE_PLACE_KEY=''other/sparse''; buildGeo (lines 34-65) folds any place bucket with g.count < MIN_AGGREGATE_CELL into SPARSE_PLACE_KEY (lines 53-60), with an explicit g.place !== ''unknown'' guard (line 54) so the unknown bucket (cases with no location token at all, line 49) is exempt from folding -- matching AGENTS.md''s stated rule that unknown names nothing to fold away. report-analytics.js''s rollupByKey has no equivalent unknown-shaped bucket to exempt: its fallback keys are literal ''other'' (channel, line 128) and ''unset'' (case_type, line 135), which are themselves just enum fallback VALUES for blank data, structurally identical to any other named bucket -- correctly NOT exempted from suppression, since folding still applies via s.opened < MIN_AGGREGATE_CELL regardless of key name. This is consistent, not a gap: exemption is reserved for a bucket that structurally names nothing (geo.js''s true no-location-token case), never merely a low-cardinality label. clusters.js has no small-cell suppression, but buildClusters only emits components of size>=2 (line 80: if (idxs.length < 2) continue) built from cases already individually visible via other case-detail views (case-level ref/status/subject, not a hidden aggregate identity) -- the MIN_AGGREGATE_CELL k-anonymity model (protecting which RARE bucket a case falls into) does not apply to a cross-case correlation view of already-open, already-visible cases; confirmed not a gap in the intended sense via re-reading clusters.js lines 39-60 design comment, which explicitly reasons about what it does and does not infer/expose.'
- mutable_id: workload-aggregate-only
  obligation_kind: postcondition
  subject: workload.js buildWorkload leaks no per-case/per-contact identifying detail through the per-operator rollup; phantom-card leak via non-roster ids is guarded.
  id: mut-1787130454081
  status: witnessed
  witness_evidence: 'workload.js buildWorkload (lines 53-128) returns {now, stale_ms, operators: [{id,name,open_assigned,stale_claims,replies_24h,first_reply_ms_median,oldest_waiting_ms}]} -- every card field is a count/median/id/name of a ROSTERED OPERATOR, never a per-case or per-contact detail. personOwner (lines 42-45) reads only c.assignee, an operator attribution field, never a contact field. The reply-attribution loop (lines 84-91) explicitly guards against a phantom card: rosterIds.has(by) (line 87) skips any id not on the current operator roster, per the inline comment at lines 79-83 explaining this prevents a stray/former-operator id from leaking into this aggregate-only endpoint. No case ref, case id, or event content is ever placed into a card; only counts and timestamps derived from case/event data are aggregated per operator.'
