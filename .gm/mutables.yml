- id: opworkflow-case-assignment-durability
  obligation_kind: replay
  prd_id: operator-workflow-stability
  subject: 'Case assignment/field updates are durable under real concurrent writes: thatcher''s busybase-backed optimistic-lock (case-store.js updateCase/updateCaseChecked, expectedVersion) must reject a losing concurrent writer with a real conflict error, never silently drop the edit while reporting false success.'
  status: witnessed
  witness_evidence: 'Live exec_js witness against a REAL CaseStore + REAL thatcher (better-sqlite3-backed libsql via busybase, isolated scratch cwd per AGENTS.md Windows file-lock discipline, no mocks). FOUND A REAL BUG via Promise.all racing genuine concurrent writes: two operators writing the SAME field on the same case with the SAME expectedVersion (real TOCTOU race) both returned fulfilled -- the loser silently lost its edit while its own promise resolved reporting the winner data as if it were its own success (e.g. alice own updateCase call returned assignee=bob with no error). Root-caused to node_modules/thatcher/src/lib/busybase/store.js update(): the conflict check rows.length===0 trusts busybase rest/v1 PATCH handler (node_modules/busybase/src/server.js:559-582), which synthesizes its response body from the PRE-write existing snapshot plus the request patch rather than confirming the underlying conditional UPDATE actually touched a row (dbUpdate has no affected-row-count check at all) -- so the conflict signal never fires under real concurrency. Also found a second related gap: a freshly-created case row has _version=null until its first update(), during which window every case-store.js call site (before._version != null guard) skips the guard entirely -- two operators both editing a brand-new case at once silently clobber each other with zero conflict signal. FIXED in deps/thatcher/src/lib/busybase/store.js (commit c7c190b on deps/thatcher local main, NOT YET PUSHED per explicit task instruction to not push without authorization): (1) create() now stamps _version:0 on every insert closing the first-write race window; (2) update() now re-reads the row after every guarded write and compares the caller own requested field values plus target _version against what actually persisted -- any mismatch is a real conflict computed from live state, never trusted from busybase echo. POST-FIX LIVE RE-WITNESS (fix temporarily staged into node_modules/thatcher for verification only, then restored to original since not yet pushed): scenario A (2 concurrent writers, different fields, real Promise.all) -- exactly one succeeds, one gets a real conflict rejection, losing write never applied to DB, loser recovers via explicit retry against fresh version, both edits present after retry. Repeated 5x with consistent exactlyOneWon=true. Stress test: 10 concurrent same-field writers via real Promise.all -- exactly 1 fulfilled, 9 rejected all with code=conflict, winner matches final persisted state exactly. First-write race (brand-new case, never previously updated) re-tested post-fix: correctly guarded now (before._version reads 0 not null; loser conflicts correctly instead of silently losing data). Scenario B: 5 concurrent updateCaseChecked (the locked+auto-retry path used by case_tools.js) all eventually succeed via internal retry with no data loss and no unhandled rejection; final state is a clean single non-corrupted value. Scenario C regression guard: re-confirmed commit a5e1174 (sibling session stale-_version fix in case-store.js transition()) still holds -- returned _version matches an immediate independent read. Separately confirmed the dashboard PATCH /api/cases/:id route (src/dashboard/routes/cases.js:280) forwards expectedVersion correctly and has NO built-in retry by design (returns a clean 409 for the operator to reload+retry, documented in the route own comment) -- this satisfies every operator action is atomic or explicitly retried per the PRD invariant: the conflict is now a REAL, correctly-detected signal post-fix rather than a false-negative that silently dropped data. node --check confirms deps/thatcher/src/lib/busybase/store.js parses clean; diff is ASCII-only in all added lines (pre-existing unrelated em-dash on line 2 left untouched, out of scope). Fix committed to deps/thatcher local main as lanmower (no AI attribution), commit c7c190b -- requires push authorization plus npm install in casey before it reaches casey runtime, per AGENTS.md composed-dependency architecture; casey node_modules/thatcher was restored to its original unpatched state after the live-witness run, so casey runtime is unaffected pending that authorization.'
