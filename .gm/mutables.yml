ains (scanned:1,drained:1) and `casey._draining` reads false afterward (GUARD_RESET_CORRECTLY=true) -- the fix does not leave the guard permanently stuck. Cross-checked resumePendingTurns (the sibling method sharing the same _draining guard, casey.js lines 581-592) as the CORRECT reference pattern -- its check-then-set has zero await between them, which is why it was never vulnerable to this class of bug; drainQueuedTurns had drifted from that pattern when the status-gate feature was added. Also live-witnessed case-sweep''s own re-entrancy guard (runSweepOnce''s _sweeping boolean, casey.js lines 393-394) as a SEPARATE, already-correctly-atomic guard (check-then-set with zero await between, matching resumePendingTurns'' shape) -- 3 concurrent runSweepOnce() calls: bodyRuns=1, RACE_CLOSED=true, 2 deferred cleanly, guard resets correctly. No fix needed there. Lint clean post-fix: node scripts/lint.mjs -> ''lint OK: 135 JS files syntax-checked, config + package + ascii + pure-agent + no-stub-mock + pii-safety clean''. node --check src/casey.js passes. Diff is ASCII-only, scoped entirely to the drainQueuedTurns/_drainQueuedTurnsBody split (45 insertions, 22 deletions, single file).'
